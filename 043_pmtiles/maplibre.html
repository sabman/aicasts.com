<html>

<head>
  <title>PMTiles MapLibre Example</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" crossorigin="anonymous">
  <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/pmtiles@3.0.5/dist/pmtiles.js"></script>
  <style>
    body {
      margin: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <script type="text/javascript">
    // add the PMTiles plugin to the maplibregl global.
    let protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    let PMTILES_URL = "https://dqqapefayjyuwzyiedci.geobase.app/storage/v1/object/public/public_bucket/doha_buildings.pmtiles?t=2024-05-20T15%3A55%3A35.757Z";

    const p = new pmtiles.PMTiles(PMTILES_URL);

    // this is so we share one instance across the JS code and the map renderer
    protocol.add(p);

    // we first fetch the header so we can get the center lon, lat of the map.
    p.getHeader().then(h => {
      const map = new maplibregl.Map({
        container: 'map',
        zoom: h.maxZoom - 6,
        center: [h.centerLon, h.centerLat],
        style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
      });

      map.on("load", () => {
        map.addSource("example_source", {
          type: "vector",
          url: "pmtiles://" + PMTILES_URL,
          attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
        }
        )

        map.addLayer(
          {
            "id": "buildings",
            "source": "example_source",
            "source-layer": "doha_buildings",
            "type": "fill",
            "paint": {
              "fill-color": "steelblue"
            }
          }
        )
        map.showTileBoundaries = false;
      });
      // https://api.maptiler.com/tiles/v3-openmaptiles/tiles.json?key={key}
    })
  </script>
</body>

</html>
